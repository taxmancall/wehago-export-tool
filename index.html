<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위하고 수출매출 업로드 생성기</title>
<style>
  body{font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:24px;color:#222;background:#f6f6f6;font-size:14px}
  h1{font-size:20px;margin:0 0 6px}
  .note{font-size:12px;color:#555;margin-bottom:16px}
  .card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .drop{flex:1;min-width:250px;border:2px dashed #bbb;border-radius:8px;padding:12px}
  .drop b{display:block;margin-bottom:8px}
  .drop{position:relative;cursor:pointer}
  .drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .drop.on{background:#eef6ff;border-color:#4a90e2}
  .drop.done{border-color:#117a2e;border-style:solid}
  .fn{font-size:12px;color:#666}
  .opt{border-style:dashed;opacity:.9}
  button{padding:8px 14px;font-size:14px;cursor:pointer;margin-right:6px}
  button:disabled{opacity:.4;cursor:not-allowed}
  table{border-collapse:collapse;width:100%;font-size:12px;margin-top:10px}
  th,td{border:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:top}
  th{background:#efefef;position:sticky;top:0}
  td.r{text-align:right;white-space:nowrap}
  .ok{color:#117a2e;font-weight:600}
  .bad{color:#b00020;font-weight:700}
  tr.warn td{background:#fff4f4}
  #summary{font-size:15px;font-weight:600;margin-bottom:8px}
  #log{white-space:pre-wrap;font-family:Consolas,monospace;font-size:12px;background:#1e1e1e;color:#ddd;padding:10px;border-radius:6px;max-height:220px;overflow:auto}
  .wrap{overflow-x:auto}
</style>
</head>
<body>
<h1>위하고 수출매출 업로드 생성기</h1>
<div class="note">
  모든 처리는 이 PC의 브라우저 안에서만 이루어지며 파일은 외부로 전송되지 않습니다.
  처음 열 때 라이브러리 로드를 위해 인터넷 연결이 필요합니다.
</div>

<div class="card">
  <div class="row">
    <div class="drop" data-k="rate"><b>① 외국환은행 환율 (달러·엔화)</b><span class="fn">여기에 끌어다 놓거나 클릭</span><input type="file" id="fRate" accept=".xls,.xlsx,.html,.htm"></div>
    <div class="drop" data-k="sales"><b>② 수출신고내역 (홈택스 다운로드)</b><span class="fn">여기에 끌어다 놓거나 클릭</span><input type="file" id="fSales" accept=".xls,.xlsx"></div>
    <div class="drop" data-k="form"><b>③ 위하고 직전 양식</b><span class="fn">여기에 끌어다 놓거나 클릭</span><input type="file" id="fForm" accept=".xls,.xlsx"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="drop opt" data-k="zip"><b>선택: 업체 증빙 압축파일 (면장 PDF) — 거래처명 채우기용</b><span class="fn">없으면 거래처명은 비워집니다</span><input type="file" id="fZip" accept=".zip"></div>
  </div>
  <p style="margin-top:14px">
    <button id="run">처리 시작</button>
    <button id="dlX" disabled>위하고 업로드 파일 받기 (.xlsx)</button>
    <button id="dlR" disabled>검증 결과 받기 (.xlsx)</button>
  </p>
</div>

<div class="card">
  <div id="summary">파일을 올리고 [처리 시작]을 누르세요.</div>
  <div class="wrap" id="tbl"></div>
</div>

<div class="card">
  <b>처리 로그</b>
  <div id="log"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  "use strict";

  const TAX_CODE = 16;      // 과세유형: 수출(영세율) - 직전 양식과 동일
  const BASIC_ACC = 401;    // 기본계정 - 직전 양식과 동일
  const REL_ACC = 108;      // 상대계정 - 직전 양식과 동일
  const NAME_MAX = 30;      // 위하고 거래처명 최대 길이
  const DEFAULT_HEADER = ["년도","월","일","매입매출구분(1-매출/2-매입)","과세유형","불공제사유",
    "신용카드거래처코드","신용카드사명","신용카드(가맹점)번호","거래처명","사업자(주민)등록번호",
    "공급가액","부가세","품명","전자세금(1.전자)","기본계정","상대계정","현금영수증 승인번호"];

  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  const $ = (id) => document.getElementById(id);
  const log = (m) => { $("log").textContent += m + "\n"; };
  const pad2 = (n) => String(n).padStart(2, "0");
  const ymdKey = (d) => `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
  const dotKey = (y) => `${y.slice(0,4)}.${y.slice(4,6)}.${y.slice(6,8)}`;
  const fmtNum = (n, dec = 0) => Number(n).toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const toYmd = (v) => {                       // 20260707 / "2026-07-07" / "2026.07.07" / "2026/07/07" 모두 허용
    const m = String(v ?? "").match(/(20\d{2})[-./]?(\d{2})[-./]?(\d{2})/);
    return m ? m[1] + m[2] + m[3] : "";
  };
  const num = (v) => { const n = parseFloat(String(v ?? "").replace(/,/g, "")); return isNaN(n) ? null : n; };

  // ---------- 파일 끌어놓기 ----------
  document.querySelectorAll(".drop").forEach((box) => {
    const input = box.querySelector("input");
    const mark = () => box.classList.toggle("done", input.files.length > 0);
    input.addEventListener("change", mark);
    box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("on"); });
    box.addEventListener("dragleave", () => box.classList.remove("on"));
    box.addEventListener("drop", (e) => {
      e.preventDefault(); box.classList.remove("on");
      if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; mark(); }
    });
  });

  // ---------- 환율 파일 (외국환은행 / 서울외국환중개 공통) ----------
  // 결과: { USD: {YYYYMMDD: 원/달러}, JPY: {YYYYMMDD: 원/100엔} }
  function parseRateText(text, rates) {
    const lines = text.replace(/<[^>]+>/g, "\n").replace(/&nbsp;/g, " ")
      .split("\n").map((s) => s.trim()).filter(Boolean);
    let n = 0;
    for (let i = 0; i < lines.length - 2; i++) {
      if (!/^20\d{2}\.\d{2}\.\d{2}$/.test(lines[i])) continue;
      const name = lines[i + 1], v = lines[i + 2];
      if (!/^[\d,]+\.\d+$/.test(v)) continue;
      const key = lines[i].replace(/\./g, ""), val = num(v);
      if (name.includes("(USD)")) { rates.USD[key] = val; n++; }
      else if (name.includes("(JPY)")) { rates.JPY[key] = val; n++; }
    }
    return n;
  }

  function parseRateSheetRows(rows, rates) {
    let n = 0;
    for (const r of rows) {
      const cells = r.map((c) => String(c ?? "").trim()).filter((c) => c !== "");
      const dateCell = cells.map(toYmd).find((x) => x);
      if (!dateCell) continue;
      const rowTxt = cells.join(" ");
      const isUSD = /USD|달러/.test(rowTxt), isJPY = /JPY|엔/.test(rowTxt);
      if (!isUSD && !isJPY) continue;
      const nums = cells.map(num).filter((x) => x !== null && x > 0 && !(x >= 19000000 && x <= 20991231));
      if (isUSD) { const v = nums.find((x) => x >= 500 && x <= 3000); if (v) { rates.USD[dateCell] = v; n++; } }
      if (isJPY) {
        const v = nums.find((x) => x >= 300 && x <= 1500) ?? nums.find((x) => x >= 3 && x <= 15);
        if (v) { rates.JPY[dateCell] = v < 50 ? v * 100 : v; n++; }   // 1엔당 값이면 100엔 기준으로 환산
      }
    }
    return n;
  }

  async function parseRateFile(file, rates) {
    const buf = await file.arrayBuffer();
    const head = new TextDecoder("latin1").decode(buf.slice(0, 200)).trimStart();
    if (head.startsWith("<")) {                       // 서울외국환중개 HTML 표(.xls)
      return parseRateText(new TextDecoder("euc-kr").decode(buf), rates);
    }
    const wb = XLSX.read(buf, { type: "array", cellDates: false });
    let n = 0;
    for (const sn of wb.SheetNames) {
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: false, defval: "" });
      n += parseRateSheetRows(rows, rates);
    }
    return n;
  }

  // 선적일 환율: 해당일 기록이 없으면 직전 영업일(최대 10일 전)
  function lookupRate(map, ymd) {
    const d = new Date(+ymd.slice(0,4), +ymd.slice(4,6) - 1, +ymd.slice(6,8));
    for (let k = 0; k < 10; k++) {
      const key = ymdKey(d);
      if (map[key] !== undefined) return { value: map[key], date: key, shifted: k > 0 };
      d.setDate(d.getDate() - 1);
    }
    return null;
  }

  // ---------- 수출신고내역 (홈택스) ----------
  const ALIAS = {
    no: ["수출신고번호", "신고번호"], date: ["선적일자", "선적일"], cur: ["통화코드", "통화"],
    fx: ["환율"], fca: ["외화금액", "결제금액"], krw: ["원화환산금액", "원화금액"], buyer: ["거래처명", "구매자"]
  };
  function findCol(header, names) { return header.findIndex((h) => names.includes(String(h).trim())); }

  async function parseSales(file) {
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: true, defval: "" });
    const hi = rows.findIndex((r) => findCol(r, ALIAS.no) >= 0);
    if (hi < 0) throw new Error("수출신고내역에서 '수출신고번호' 열을 찾지 못했습니다.");
    const h = rows[hi];
    const c = Object.fromEntries(Object.entries(ALIAS).map(([k, v]) => [k, findCol(h, v)]));
    return rows.slice(hi + 1).filter((r) => String(r[c.no]).trim() !== "").map((r) => ({
      decl: String(r[c.no]).replace(/-/g, "").trim(),
      ymd: toYmd(r[c.date]),
      cur: String(r[c.cur]).trim().toUpperCase().replace("USD", "USD"),
      fca: num(r[c.fca]),
      krwOrig: c.krw >= 0 ? num(r[c.krw]) : null
    }));
  }

  // ---------- 직전 양식 (헤더·시트명 그대로 사용) ----------
  async function parseForm(file) {
    if (!file) return { sheet: "매출자료 & 매입자료", header: DEFAULT_HEADER };
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const sn = wb.SheetNames[0];
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: "" });
    const hi = rows.findIndex((r) => r.includes("년도"));
    return { sheet: sn, header: hi >= 0 ? rows[hi].map((x) => String(x)) : DEFAULT_HEADER };
  }

  // ---------- 면장 PDF (선택) ----------
  async function parseEvidenceZip(file) {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const docs = {};
    for (const name of Object.keys(zip.files)) {
      if (!/\.pdf$/i.test(name) || zip.files[name].dir) continue;
      const data = await zip.files[name].async("uint8array");
      const pdf = await pdfjsLib.getDocument({ data }).promise;
      let text = "";
      for (let p = 1; p <= Math.min(pdf.numPages, 3); p++) {
        const tc = await (await pdf.getPage(p)).getTextContent();
        text += tc.items.map((it) => it.str).join(" ") + "\n";
      }
      if (!text.replace(/\s/g, "").includes("수출신고필증")) continue;
      const flat = text.replace(/\s+/g, "");
      const declM = flat.match(/(\d{5}-\d{2}-[A-Z]?\d{6}X)/);
      const payM = flat.match(/결제금액(EXW|FOB|CIF|CFR|DAP|DDU|DDP|CPT|CIP|FCA)-([A-Z]{3})-([\d,]+(?:\.\d+)?)/);
      const buyerM = text.match(/구\s*매\s*자\s+(.+?)\s+26\s+환급/);
      if (!declM) { log(`[면장] 신고번호 인식 실패: ${name}`); continue; }
      const key = declM[1].replace(/-/g, "");
      if (docs[key]) continue;
      docs[key] = { buyer: buyerM ? buyerM[1].trim() : "", cur: payM ? payM[2] : "", fca: payM ? num(payM[3]) : null };
    }
    log(`면장 ${Object.keys(docs).length}건 인식`);
    return docs;
  }

  // ---------- 처리 ----------
  let outAoa = null, reportAoa = null, outSheet = "매출자료 & 매입자료";

  $("run").onclick = async () => {
    $("log").textContent = "";
    $("dlX").disabled = $("dlR").disabled = true;
    try {
      const fRate = $("fRate").files[0], fSales = $("fSales").files[0], fForm = $("fForm").files[0], fZip = $("fZip").files[0];
      if (!fRate || !fSales) { alert("① 환율 파일과 ② 수출신고내역을 올려 주세요."); return; }

      log("환율 파일 읽는 중...");
      const rates = { USD: {}, JPY: {} };
      const nRate = await parseRateFile(fRate, rates);
      log(`  달러 ${Object.keys(rates.USD).length}일, 엔화 ${Object.keys(rates.JPY).length}일 (${nRate}건 인식)`);

      log("수출신고내역 읽는 중...");
      const sales = await parseSales(fSales);
      log(`  ${sales.length}건`);

      const form = await parseForm(fForm);
      outSheet = form.sheet;
      const docs = fZip ? await parseEvidenceZip(fZip) : {};
      if (!fZip) log("압축파일 없음: 거래처명은 비워집니다.");

      const outRows = [], report = [];
      let okCnt = 0, warnCnt = 0, sum = 0;
      for (const s of sales) {
        const doc = docs[s.decl];
        const rt = lookupRate(rates[s.cur] || {}, s.ymd);
        const issues = [];
        if (!rt) issues.push("환율 없음");
        if (fZip && !doc) issues.push("면장 없음");
        if (doc && doc.cur && doc.cur !== s.cur) issues.push(`통화 불일치(면장 ${doc.cur})`);
        if (doc && doc.fca !== null && doc.fca !== s.fca) issues.push(`외화금액 불일치(면장 ${fmtNum(doc.fca, 2)})`);
        if (fZip && doc && !doc.buyer) issues.push("구매자 확인필요");

        let krw = null;
        if (rt) {
          const unit = s.cur === "JPY" ? rt.value / 100 : rt.value;   // 1외화단위당 원
          krw = Math.floor((s.fca * Math.round(unit * 10000)) / 10000); // 원 미만 절사
        }
        if (krw !== null && s.krwOrig !== null && krw !== s.krwOrig) issues.push(`홈택스 원화와 차이(${fmtNum(s.krwOrig)})`);
        if (issues.length) warnCnt++; else okCnt++;
        if (krw !== null) sum += krw;

        const buyer = doc && doc.buyer ? doc.buyer.slice(0, NAME_MAX) : "";
        const amtStr = s.cur === "JPY" ? fmtNum(s.fca) : fmtNum(s.fca, 2);
        const rateStr = rt ? fmtNum(rt.value, 2) : "";
        outRows.push({ y: +s.ymd.slice(0,4), m: +s.ymd.slice(4,6), d: +s.ymd.slice(6,8), buyer, krw,
                       item: `${s.decl} | ${s.cur} ${amtStr} | 환율 ${rateStr}`, issues });
        report.push({ decl: s.decl, date: dotKey(s.ymd), cur: s.cur, fca: s.fca, buyer: doc ? doc.buyer : "",
                      rate: rt ? rt.value : "", rateDate: rt ? dotKey(rt.date) + (rt.shifted ? " (직전영업일)" : "") : "",
                      krwCalc: krw, krwOrig: s.krwOrig, status: issues.length ? issues.join(" / ") : "정상" });
      }

      // 위하고 업로드 시트: 직전 양식 헤더 그대로, 부가세 열은 공란
      const idx = (name) => form.header.findIndex((h) => h.includes(name));
      const H = form.header;
      outAoa = [H];
      for (const r of outRows) {
        const row = new Array(H.length).fill(null);
        const set = (name, v) => { const i = idx(name); if (i >= 0) row[i] = v; };
        set("년도", r.y); set("월", r.m); set("일", r.d);
        set("매입매출구분", 1); set("과세유형", TAX_CODE);
        set("거래처명", r.buyer); set("공급가액", r.krw); set("품명", r.item);
        set("기본계정", BASIC_ACC); set("상대계정", REL_ACC);
        outAoa.push(row);
      }
      reportAoa = [["신고번호","선적일","통화","외화금액(홈택스)","구매자(면장)","기준율","기준일","원화(계산)","원화(홈택스)","판정"]];
      for (const r of report) reportAoa.push([r.decl, r.date, r.cur, r.fca, r.buyer, r.rate, r.rateDate, r.krwCalc, r.krwOrig, r.status]);

      $("summary").innerHTML = `총 ${sales.length}건 · 정상 <span class="ok">${okCnt}</span> · 확인필요 <span class="bad">${warnCnt}</span> · 공급가액 합계 ${fmtNum(sum)}원`;
      renderTable(report);
      $("dlX").disabled = false; $("dlR").disabled = false;
      log("완료.");
    } catch (e) {
      log("오류: " + (e && e.message ? e.message : e));
      alert("처리 중 오류가 발생했습니다. 로그를 확인하세요.");
    }
  };

  function renderTable(report) {
    let h = "<table><tr><th>신고번호</th><th>선적일</th><th>통화</th><th>외화금액</th><th>구매자(면장)</th><th>기준율</th><th>기준일</th><th>원화(계산)</th><th>원화(홈택스)</th><th>판정</th></tr>";
    for (const r of report) {
      const warn = r.status !== "정상";
      h += `<tr class="${warn ? "warn" : ""}"><td>${esc(r.decl)}</td><td>${esc(r.date)}</td><td>${esc(r.cur)}</td>` +
        `<td class="r">${fmtNum(r.fca, r.cur === "JPY" ? 0 : 2)}</td><td>${esc(r.buyer)}</td>` +
        `<td class="r">${r.rate === "" ? "" : fmtNum(r.rate, 2)}</td><td>${esc(r.rateDate)}</td>` +
        `<td class="r">${r.krwCalc === null ? "" : fmtNum(r.krwCalc)}</td><td class="r">${r.krwOrig === null ? "" : fmtNum(r.krwOrig)}</td>` +
        `<td class="${warn ? "bad" : "ok"}">${esc(r.status)}</td></tr>`;
    }
    $("tbl").innerHTML = h + "</table>";
  }

  function toSheet(aoa, numCols) {
    const ws = XLSX.utils.aoa_to_sheet(aoa);
    for (let R = 1; R < aoa.length; R++) for (const C of numCols) {
      const ref = XLSX.utils.encode_cell({ r: R, c: C });
      if (ws[ref] && typeof ws[ref].v === "number") ws[ref].z = "0";
    }
    return ws;
  }

  $("dlX").onclick = () => {
    const wb = XLSX.utils.book_new();
    const ci = outAoa[0].findIndex((h) => h.includes("공급가액"));
    XLSX.utils.book_append_sheet(wb, toSheet(outAoa, [ci]), outSheet);
    XLSX.writeFile(wb, "위하고_수출매출_업로드.xlsx");
  };
  $("dlR").onclick = () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, toSheet(reportAoa, [3, 7, 8]), "검증결과");
    XLSX.writeFile(wb, "수출매출_검증결과.xlsx");
  };
})();
</script>
